name: Build iPhone app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MirrorLink.xcodeproj \
            -scheme MirrorLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          # Xcode creates the .app folder before compiling, so check the program itself exists.
          test -f build/Build/Products/Release-iphoneos/MirrorLink.app/MirrorLink

      - name: Show errors if the build failed
        if: failure()
        working-directory: ios
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MirrorLink.app Payload/
          zip -qry MirrorLink-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorLink-ipa
          path: ios/MirrorLink-unsigned.ipa
