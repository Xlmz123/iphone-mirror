# XcodeGen spec — the Xcode project is generated from this on GitHub's Mac
# build server, so you never need a Mac or Xcode yourself.
name: MirrorLink
options:
  bundleIdPrefix: com.mirrorlink
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  MirrorLink:
    type: application
    platform: iOS
    sources:
      - path: MirrorLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirrorlink.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: MirrorLink/Info.plist
      properties:
        CFBundleDisplayName: MirrorLink
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keeps screen capture alive when you leave the app (iOS 27+).
        UIBackgroundModes:
          - screen-capture
          - audio          # silent-audio keep-alive (KeepAlive.swift)
        NSScreenCaptureUsageDescription: MirrorLink shows your screen on your paired PC.
        # Wi-Fi mirroring: lets the PC find this iPhone on the local network.
        NSBonjourServices:
          - _mirrorlink._tcp
        NSLocalNetworkUsageDescription: MirrorLink uses your local network so your paired PC can show your screen over Wi-Fi.
